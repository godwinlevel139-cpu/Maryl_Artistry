<script>
(function(){
"use strict";

const KEY = "maryl_data";

/* STORAGE */
function getData(){
try{
return JSON.parse(localStorage.getItem(KEY)) || {
gallery:[],
videos:[],
reviews:[],
portrait:""
};
}catch(e){
return {gallery:[],videos:[],reviews:[],portrait:""};
}
}

/* =========================
   REVIEWS (APPROVED ONLY)
========================= */
function loadReviews(){
const data = getData();
const container = document.querySelector(".rev-grid");

if(!container) return;

const approved = data.reviews.filter(r => r.approved);

if(!approved.length){
container.innerHTML = `
<div class="rev-card">
<p style="color:rgba(255,255,255,0.6)">
No reviews yet — be the first to leave one 💄
</p>
</div>`;
return;
}

container.innerHTML = approved.map(r => `
<div class="rev-card">
<div class="rev-quote">“</div>

<div class="stars">
${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}
</div>

<p class="rev-text">${r.review}</p>

<div class="rev-author">
<div class="rev-avatar">
${r.name.charAt(0).toUpperCase()}
</div>
<div>
<div class="rev-name">${r.name}</div>
<div class="rev-occ">${r.service}</div>
</div>
</div>
</div>
`).join("");
}

/* =========================
   GALLERY
========================= */
function loadGallery(){
const data = getData();
const grid = document.querySelector(".gallery-grid");

if(!grid) return;

if(!data.gallery.length){
grid.innerHTML = `<div class="g-empty">No images yet</div>`;
return;
}

grid.innerHTML = data.gallery.map((img,i)=>`
<div class="gallery-item ${i===0?'featured':''}">
<img src="${img}">
<div class="g-hover"><span>View</span></div>
</div>
`).join("");
}

/* =========================
   VIDEOS
========================= */
function loadVideos(){
const data = getData();
const grid = document.querySelector(".tut-grid");

if(!grid) return;

if(!data.videos.length){
grid.innerHTML = `<div class="no-vids">No tutorials yet</div>`;
return;
}

grid.innerHTML = data.videos.map(v=>`
<div class="tut-card">
<div class="tut-thumb">
<iframe src="https://www.youtube.com/embed/${getYouTubeID(v)}" allowfullscreen></iframe>
</div>
<div class="tut-info">
<div class="tut-name">Makeup Tutorial</div>
</div>
</div>
`).join("");
}

function getYouTubeID(url){
let reg = /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;
let match = url.match(reg);
return match ? match[1] : url;
}

/* =========================
   PORTRAIT (ABOUT IMAGE)
========================= */
function loadPortrait(){
const data = getData();
const img = document.querySelector(".about-img-wrap img");

if(img && data.portrait){
img.src = data.portrait;
}
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", function(){
loadReviews();
loadGallery();
loadVideos();
loadPortrait();
});

})();
</script>
