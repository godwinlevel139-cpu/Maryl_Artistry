<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review — Maryl_Artistry</title>

<link rel="icon" href="images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--gold:#C9A84C;--gold-light:#E8D5A3;--gold-dark:#8B6914;
--cream:#FAF7F2;--dark:#1A1208;--text:#2C1F06;
--muted:#7A6840;--white:#fff;--border:rgba(201,168,76,0.25);
--pink:#F9EEE8;--red:#c0392b;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);}

/* TOP BAR */
.top-bar{
background:var(--dark);
padding:1rem 2rem;
display:flex;
justify-content:space-between;
align-items:center;
}

.top-logo{
display:flex;
align-items:center;
gap:0.6rem;
text-decoration:none;
}

.top-logo img{
width:38px;height:38px;border-radius:50%;
border:1.5px solid var(--gold);
}

.top-logo span{
font-family:'Cormorant Garamond',serif;
color:var(--gold-light);
font-size:1.2rem;
}

.top-back{
color:#bbb;
text-decoration:none;
font-size:0.75rem;
letter-spacing:0.1em;
text-transform:uppercase;
}

.top-back:hover{color:var(--gold);}

/* HERO */
.rev-hero{
background:linear-gradient(160deg,#1A1208,#3D2E0E);
text-align:center;
padding:4rem 2rem;
}

.hero-logo{
width:100px;height:100px;border-radius:50%;
border:2px solid var(--gold);
margin-bottom:1rem;
animation:glow 3s infinite;
}

@keyframes glow{
0%,100%{box-shadow:0 0 20px rgba(201,168,76,0.2);}
50%{box-shadow:0 0 60px rgba(201,168,76,0.5);}
}

.rev-title{
font-family:'Cormorant Garamond',serif;
font-size:2.5rem;
color:white;
}

.rev-title em{color:var(--gold-light);}

.rev-sub{
color:#ccc;
max-width:500px;
margin:1rem auto 0;
}

/* FORM */
.container{
max-width:520px;
margin:3rem auto;
padding:2rem;
background:white;
border:1px solid var(--border);
}

/* STARS */
.star-row{
display:flex;
flex-direction:row-reverse;
justify-content:flex-end;
}

.star-row input{display:none;}

.star-row label{
font-size:2.2rem;
color:#ddd;
cursor:pointer;
}

.star-row input:checked ~ label,
.star-row label:hover,
.star-row label:hover ~ label{
color:var(--gold);
}

/* INPUTS */
input,select,textarea{
width:100%;
padding:0.8rem;
margin-top:0.4rem;
border:1px solid var(--border);
}

textarea{min-height:120px;}

/* BUTTON */
.btn{
width:100%;
margin-top:1.5rem;
padding:1rem;
background:var(--gold);
border:none;
cursor:pointer;
}

.btn:hover{background:var(--gold-dark);color:white;}

/* SUCCESS */
.success{
display:none;
text-align:center;
}

.success.show{display:block;}

</style>
</head>

<body>

<div class="top-bar">
<a href="index.html" class="top-logo">
<img src="images/logo.png">
<span>Maryl_Artistry</span>
</a>
<a href="index.html" class="top-back">← Back</a>
</div>

<div class="rev-hero">
<img src="images/logo.png" class="hero-logo">
<h1 class="rev-title">Leave a <em>Review</em></h1>
<p class="rev-sub">Tell us about your experience</p>
</div>

<div class="container">

<div id="formBox">

<div class="star-row">
<input type="radio" name="rating" value="5" id="s5"><label for="s5">★</label>
<input type="radio" name="rating" value="4" id="s4"><label for="s4">★</label>
<input type="radio" name="rating" value="3" id="s3"><label for="s3">★</label>
<input type="radio" name="rating" value="2" id="s2"><label for="s2">★</label>
<input type="radio" name="rating" value="1" id="s1"><label for="s1">★</label>
</div>

<input id="name" placeholder="Your name">

<select id="service">
<option value="">Select service</option>
<option>Bridal</option>
<option>Birthday</option>
<option>Photoshoot</option>
</select>

<textarea id="review" placeholder="Write your review..."></textarea>

<button class="btn" id="submitBtn">Submit Review</button>

</div>

<div class="success" id="successBox">
<h2>Thank You 💄</h2>
<p>Your review is awaiting admin approval.</p>
</div>

</div>

<script>
const KEY = "maryl_data";

function getData(){
return JSON.parse(localStorage.getItem(KEY)) || {reviews:[]};
}

function saveData(d){
localStorage.setItem(KEY, JSON.stringify(d));
}

document.getElementById("submitBtn").onclick = function(){

let name = document.getElementById("name").value.trim();
let review = document.getElementById("review").value.trim();
let service = document.getElementById("service").value;
let ratingEl = document.querySelector("input[name='rating']:checked");

if(!name || !review || !service || !ratingEl){
alert("Please fill everything");
return;
}

let data = getData();

data.reviews.push({
name, review, service,
rating: ratingEl.value,
approved:false
});

saveData(data);

document.getElementById("formBox").style.display="none";
document.getElementById("successBox").classList.add("show");
};
</script>

</body>
</html>
