<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Maryl_Artistry</title>

<link rel="icon" href="images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--gold:#C9A84C;--cream:#FAF7F2;--dark:#1A1208;
--text:#2C1F06;--muted:#7A6840;--white:#fff;
--border:rgba(201,168,76,0.25);--red:#c0392b;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);}

/* HEADER */
.top{
background:var(--dark);
color:white;
padding:1rem 2rem;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:0.6rem;
}

.logo img{
width:38px;height:38px;border-radius:50%;
border:1.5px solid var(--gold);
}

.logo span{
font-family:'Cormorant Garamond',serif;
color:var(--gold);
font-size:1.2rem;
}

.logout{
cursor:pointer;
font-size:0.8rem;
letter-spacing:0.1em;
}

/* LOGIN */
.login{
max-width:400px;
margin:5rem auto;
background:white;
padding:2rem;
border:1px solid var(--border);
}

.login h2{
font-family:'Cormorant Garamond',serif;
margin-bottom:1rem;
}

input{
width:100%;
padding:0.8rem;
margin-bottom:1rem;
border:1px solid var(--border);
}

button{
padding:0.8rem;
width:100%;
background:var(--gold);
border:none;
cursor:pointer;
}

button:hover{background:#8B6914;color:white;}

/* DASHBOARD */
.container{
max-width:900px;
margin:2rem auto;
padding:1rem;
}

.card{
background:white;
padding:1.5rem;
margin-bottom:1rem;
border:1px solid var(--border);
}

.actions{
display:flex;
gap:0.5rem;
margin-top:1rem;
}

.approve{background:green;color:white;}
.delete{background:var(--red);color:white;}

.badge{
font-size:0.7rem;
padding:0.2rem 0.6rem;
border:1px solid var(--border);
margin-left:0.5rem;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="top">
  <div class="logo">
    <img src="images/logo.png">
    <span>Admin Panel</span>
  </div>
  <div class="logout" onclick="logout()">Logout</div>
</div>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Admin Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="container" id="dashboard" style="display:none;"></div>

<script>
const KEY = "maryl_data";
const USER = "admin";
const PASS = "1234";

/* STORAGE */
function getData(){
return JSON.parse(localStorage.getItem(KEY)) || {reviews:[]};
}

function saveData(d){
localStorage.setItem(KEY, JSON.stringify(d));
}

/* LOGIN */
function login(){
let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

if(u===USER && p===PASS){
localStorage.setItem("admin_logged", "true");
init();
}else{
alert("Wrong login");
}
}

function logout(){
localStorage.removeItem("admin_logged");
location.reload();
}

/* INIT */
function init(){
if(localStorage.getItem("admin_logged")!=="true") return;

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

render();
}

/* RENDER */
function render(){
let data = getData();
let box = document.getElementById("dashboard");

if(!data.reviews.length){
box.innerHTML = "<p>No reviews yet</p>";
return;
}

box.innerHTML = data.reviews.map((r,i)=>`
<div class="card">
<strong>${r.name}</strong> — ${r.service}
<span class="badge">${r.approved ? "Approved" : "Pending"}</span>

<p style="margin-top:0.5rem">${r.review}</p>

<div class="actions">
<button class="approve" onclick="approve(${i})">Approve</button>
<button class="delete" onclick="del(${i})">Delete</button>
</div>
</div>
`).join('');
}

/* ACTIONS */
function approve(i){
let d = getData();
d.reviews[i].approved = true;
saveData(d);
render();
}

function del(i){
let d = getData();
d.reviews.splice(i,1);
saveData(d);
render();
}

/* AUTO INIT */
init();
</script>

</body>
</html>
